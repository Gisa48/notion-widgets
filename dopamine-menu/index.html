<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dopamine Menu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%239DAA92'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CUSTOMIZABLE THEME VARIABLES
       ========================================================================== */
    :root {
      --bg: #F8F3EA;             /* Warm cream background */
      --card-bg: #FFFFFF;        /* Pure stationery white */
      --text: #4A3A30;           /* Deep espresso brown */
      --text-muted: #8C7A6B;     /* Soft warm brown */
      --clay: #C4886C;           /* Terracotta accent */
      --clay-hover: #B3765A;     /* Darker clay */
      --clay-active: #9F654C;
      --sage: #9DAA92;           /* Sage green */
      --sand: #D8B98F;           /* Sand paper shadow */
      --line: #DDD0C3;           /* Paper borders & rules */
      --focus-ring: #C4886C;

      /* Category Colors */
      --cat-move: #9DAA92;       /* Sage */
      --cat-sense: #D8B98F;      /* Sand */
      --cat-create: #C4886C;     /* Terracotta */
      --cat-connect: #B57E6B;    /* Dusty Clay */
      --cat-rest: #839478;       /* Moss Green */

      --card-radius: 18px;
      --card-shadow: 0 8px 0 var(--sand), 0 14px 28px rgba(74, 58, 48, 0.07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2F2620;
        --card-bg: #3A2D25;
        --text: #F8F3EA;
        --text-muted: #B8A99C;
        --line: #524237;
        --sand: #231B16;
        --card-shadow: 0 8px 0 var(--sand), 0 16px 30px rgba(0, 0, 0, 0.4);
      }
    }

    [data-theme="dark"] {
      --bg: #2F2620;
      --card-bg: #3A2D25;
      --text: #F8F3EA;
      --text-muted: #B8A99C;
      --line: #524237;
      --sand: #231B16;
      --card-shadow: 0 8px 0 var(--sand), 0 16px 30px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg: #F8F3EA;
      --card-bg: #FFFFFF;
      --text: #4A3A30;
      --text-muted: #8C7A6B;
      --line: #DDD0C3;
      --sand: #D8B98F;
      --card-shadow: 0 8px 0 var(--sand), 0 14px 28px rgba(74, 58, 48, 0.07);
    }

    /* ==========================================================================
       RESET & BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Nunito', Arial, sans-serif;
      font-weight: 600;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ==========================================================================
       CARD STYLES
       ========================================================================== */
    .widget-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 2.5px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 22px 20px 22px;
      position: relative;
      transition: background-color 250ms ease, border-color 250ms ease, box-shadow 250ms ease;
    }

    /* Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--clay);
      flex-shrink: 0;
    }

    .card-title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    /* Random Picker Spotlight Section */
    .picker-section {
      margin-bottom: 20px;
    }

    .btn {
      font-family: 'Nunito', Arial, sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      min-height: 46px;
      border-radius: 26px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 20px;
      transition: background-color 200ms ease, transform 150ms ease, box-shadow 200ms ease, border-color 200ms ease;
      text-decoration: none;
      user-select: none;
      width: 100%;
    }

    .btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .btn:active {
      transform: translateY(1.5px);
    }

    .btn-primary {
      background: var(--clay);
      color: #FFFFFF;
      border: 2px solid var(--clay);
      box-shadow: 0 4px 0 var(--clay-active);
    }

    .btn-primary:hover {
      background: var(--clay-hover);
      border-color: var(--clay-hover);
    }

    .btn-primary:active {
      box-shadow: 0 1px 0 var(--clay-active);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--bg);
      border-color: var(--text-muted);
    }

    /* Highlighted Reward Box */
    .reward-spotlight {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: var(--bg);
      border: 2px dashed var(--line);
      border-radius: 14px;
      animation: gentleSlideIn 280ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reward-spotlight.visible {
      display: block;
    }

    .reward-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .reward-cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 20px;
      color: #FFFFFF;
    }

    .reward-cat-tag svg {
      width: 12px;
      height: 12px;
    }

    .reward-text {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800;
      font-size: 1.3rem;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 12px;
    }

    .reward-actions {
      display: flex;
      gap: 8px;
    }

    .reward-actions .btn {
      min-height: 38px;
      font-size: 0.85rem;
      padding: 0 14px;
    }

    /* Filter Pills */
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .filter-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      flex-shrink: 0;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 20px;
      padding: 6px 12px;
      font-family: 'Nunito', Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 200ms ease;
    }

    .pill-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .pill-btn.active {
      background: var(--text);
      color: var(--card-bg);
      border-color: var(--text);
    }

    .pill-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    /* Categories List Container */
    .categories-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .category-card {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--card-bg);
      transition: border-color 200ms ease;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cat-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-icon-badge {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .cat-icon-badge svg {
      width: 15px;
      height: 15px;
    }

    .cat-name {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .cat-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Items list inside category */
    .items-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      list-style: none;
    }

    .item-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 0.84rem;
      color: var(--text);
      transition: all 180ms ease;
    }

    .item-chip:hover {
      border-color: var(--text-muted);
    }

    .delete-item-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      transition: color 150ms ease, background-color 150ms ease;
    }

    .delete-item-btn:hover {
      color: #D32F2F;
      background-color: rgba(211, 47, 47, 0.1);
    }

    .delete-item-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
    }

    /* Add Item Inline Form */
    .add-item-form {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .add-item-input {
      flex: 1;
      height: 34px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      font-family: 'Nunito', Arial, sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text);
      transition: border-color 200ms ease;
    }

    .add-item-input:focus {
      outline: none;
      border-color: var(--clay);
    }

    .add-item-btn {
      height: 34px;
      padding: 0 12px;
      background: transparent;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 180ms ease;
    }

    .add-item-btn:hover {
      background: var(--bg);
      border-color: var(--text-muted);
    }

    .add-item-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    /* Footer reset button */
    .footer-actions {
      margin-top: 18px;
      text-align: center;
    }

    .text-link-btn {
      background: transparent;
      border: none;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 180ms ease;
    }

    .text-link-btn:hover {
      color: var(--text);
    }

    .text-link-btn:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Animations */
    @keyframes gentleSlideIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Responsive */
    @media (max-width: 340px) {
      .widget-card {
        padding: 16px 12px 18px;
      }
      .reward-text {
        font-size: 1.15rem;
      }
      .btn {
        font-size: 0.85rem;
      }
      .add-item-input {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>
  <main class="widget-card" role="region" aria-label="Dopamine Menu Rewards">
    <!-- Header -->
    <header class="card-header">
      <div class="title-wrap">
        <span class="status-dot" aria-hidden="true"></span>
        <h1 class="card-title">My dopamine menu</h1>
      </div>
    </header>

    <!-- Randomizer CTA -->
    <section class="picker-section" aria-label="Reward Picker">
      <button class="btn btn-primary" id="pickRewardBtn" aria-label="Pick a random reward for me">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
        </svg>
        <span>Pick a reward for me</span>
      </button>

      <!-- Spotlight Result Card -->
      <div class="reward-spotlight" id="rewardSpotlight" role="status" aria-live="polite">
        <div class="reward-badge-row">
          <span class="reward-cat-tag" id="rewardCatBadge">
            <span id="rewardCatIcon" aria-hidden="true"></span>
            <span id="rewardCatName">Category</span>
          </span>
          <button class="delete-item-btn" id="dismissRewardBtn" aria-label="Dismiss reward" title="Dismiss">×</button>
        </div>
        <div class="reward-text" id="rewardText">A soothing rest</div>
        <div class="reward-actions">
          <button class="btn btn-secondary" id="anotherRewardBtn" aria-label="Pick another reward">Another one</button>
        </div>
      </div>
    </section>

    <!-- Category Filter Pills -->
    <nav class="filter-pills" role="tablist" aria-label="Filter rewards by category">
      <button class="pill-btn active" role="tab" aria-selected="true" data-category="all">All</button>
      <button class="pill-btn" role="tab" aria-selected="false" data-category="move">Move</button>
      <button class="pill-btn" role="tab" aria-selected="false" data-category="sense">Sense</button>
      <button class="pill-btn" role="tab" aria-selected="false" data-category="create">Create</button>
      <button class="pill-btn" role="tab" aria-selected="false" data-category="connect">Connect</button>
      <button class="pill-btn" role="tab" aria-selected="false" data-category="rest">Rest</button>
    </nav>

    <!-- Category Rows -->
    <div class="categories-wrap" id="categoriesWrap">
      <!-- Generated dynamically by JS -->
    </div>

    <!-- Reset to defaults if needed -->
    <div class="footer-actions">
      <button class="text-link-btn" id="resetDefaultsBtn">Reset menu to sample defaults</button>
    </div>
  </main>

  <script>
    /* ==========================================================================
       DOPAMINE MENU LOGIC (ADHD dopamine boost organizer & randomizer)
       ========================================================================== */
    (function () {
      // Safe LocalStorage wrapper
      const storage = {
        get(key, fallback) {
          try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : fallback;
          } catch (e) {
            return fallback;
          }
        },
        set(key, val) {
          try {
            localStorage.setItem(key, JSON.stringify(val));
          } catch (e) {
            /* no-op in sandboxed iframes */
          }
        }
      };

      // Category Definitions with SVG icons and colors
      const CATEGORIES = [
        {
          id: 'move',
          name: 'Move',
          color: 'var(--cat-move)',
          icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
          defaults: ['stretch', 'walk', 'dance to one song']
        },
        {
          id: 'sense',
          name: 'Sense',
          color: 'var(--cat-sense)',
          icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>`,
          defaults: ['cold water on face', 'favourite smell', 'hot drink']
        },
        {
          id: 'create',
          name: 'Create',
          color: 'var(--cat-create)',
          icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>`,
          defaults: ['doodle', 'write one sentence', 'cook something']
        },
        {
          id: 'connect',
          name: 'Connect',
          color: 'var(--cat-connect)',
          icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
          defaults: ['message a friend', 'voice note']
        },
        {
          id: 'rest',
          name: 'Rest',
          color: 'var(--cat-rest)',
          icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
          defaults: ['lie down 10 min', 'look out a window']
        }
      ];

      function buildInitialData() {
        const data = {};
        CATEGORIES.forEach(c => {
          data[c.id] = [...c.defaults];
        });
        return data;
      }

      let menuData = storage.get('dopamine_menu_items', buildInitialData());
      let activeFilter = 'all';

      // DOM references
      const categoriesWrap = document.getElementById('categoriesWrap');
      const pickRewardBtn = document.getElementById('pickRewardBtn');
      const rewardSpotlight = document.getElementById('rewardSpotlight');
      const rewardCatBadge = document.getElementById('rewardCatBadge');
      const rewardCatIcon = document.getElementById('rewardCatIcon');
      const rewardCatName = document.getElementById('rewardCatName');
      const rewardText = document.getElementById('rewardText');
      const dismissRewardBtn = document.getElementById('dismissRewardBtn');
      const anotherRewardBtn = document.getElementById('anotherRewardBtn');
      const filterPills = document.querySelectorAll('.pill-btn');
      const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');

      function save() {
        storage.set('dopamine_menu_items', menuData);
      }

      // Render Categories and their items
      function render() {
        categoriesWrap.innerHTML = '';

        CATEGORIES.forEach(cat => {
          // Filter check
          if (activeFilter !== 'all' && activeFilter !== cat.id) {
            return;
          }

          const items = menuData[cat.id] || [];

          const catCard = document.createElement('div');
          catCard.className = 'category-card';
          catCard.setAttribute('data-category-id', cat.id);

          // Header
          const header = document.createElement('div');
          header.className = 'category-header';
          header.innerHTML = `
            <div class="cat-title-group">
              <span class="cat-icon-badge" style="background-color: ${cat.color};" aria-hidden="true">
                ${cat.icon}
              </span>
              <h2 class="cat-name">${cat.name}</h2>
            </div>
            <span class="cat-count">${items.length} ${items.length === 1 ? 'idea' : 'ideas'}</span>
          `;
          catCard.appendChild(header);

          // Items Chips List
          const ul = document.createElement('ul');
          ul.className = 'items-list';
          ul.setAttribute('aria-label', `${cat.name} ideas`);

          if (items.length === 0) {
            const emptyLi = document.createElement('li');
            emptyLi.style.fontSize = '0.8rem';
            emptyLi.style.color = 'var(--text-muted)';
            emptyLi.style.fontStyle = 'italic';
            emptyLi.textContent = 'No items yet. Add one below.';
            ul.appendChild(emptyLi);
          } else {
            items.forEach((item, index) => {
              const li = document.createElement('li');
              li.className = 'item-chip';

              const span = document.createElement('span');
              span.textContent = item;

              const delBtn = document.createElement('button');
              delBtn.className = 'delete-item-btn';
              delBtn.innerHTML = '&times;';
              delBtn.setAttribute('aria-label', `Remove "${item}"`);
              delBtn.setAttribute('title', 'Remove');
              delBtn.addEventListener('click', () => {
                removeItem(cat.id, index);
              });

              li.appendChild(span);
              li.appendChild(delBtn);
              ul.appendChild(li);
            });
          }
          catCard.appendChild(ul);

          // Inline Add Form
          const form = document.createElement('form');
          form.className = 'add-item-form';
          form.innerHTML = `
            <input type="text" class="add-item-input" placeholder="Add idea to ${cat.name}..." maxlength="50" aria-label="Add new ${cat.name} idea">
            <button type="submit" class="add-item-btn" aria-label="Add idea">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Add
            </button>
          `;

          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = form.querySelector('.add-item-input');
            const val = input.value.trim();
            if (val) {
              addItem(cat.id, val);
              input.value = '';
            }
          });

          catCard.appendChild(form);
          categoriesWrap.appendChild(catCard);
        });
      }

      function addItem(catId, text) {
        if (!menuData[catId]) menuData[catId] = [];
        menuData[catId].push(text);
        save();
        render();
      }

      function removeItem(catId, index) {
        if (!menuData[catId]) return;
        menuData[catId].splice(index, 1);
        save();
        render();
      }

      // Random Reward Picker Logic
      function pickRandomReward() {
        const eligibleItems = [];

        CATEGORIES.forEach(cat => {
          if (activeFilter !== 'all' && activeFilter !== cat.id) return;
          const items = menuData[cat.id] || [];
          items.forEach(text => {
            eligibleItems.push({
              text,
              category: cat
            });
          });
        });

        if (eligibleItems.length === 0) {
          rewardCatBadge.style.backgroundColor = 'var(--text-muted)';
          rewardCatIcon.innerHTML = '';
          rewardCatName.textContent = 'Empty';
          rewardText.textContent = 'Add some items first to pick a reward!';
          rewardSpotlight.classList.add('visible');
          return;
        }

        const choice = eligibleItems[Math.floor(Math.random() * eligibleItems.length)];

        rewardCatBadge.style.backgroundColor = choice.category.color;
        rewardCatIcon.innerHTML = choice.category.icon;
        rewardCatName.textContent = choice.category.name;
        rewardText.textContent = choice.text;

        rewardSpotlight.classList.remove('visible');
        void rewardSpotlight.offsetWidth; // Trigger reflow for smooth pop-in
        rewardSpotlight.classList.add('visible');
      }

      // Event Listeners
      pickRewardBtn.addEventListener('click', pickRandomReward);
      anotherRewardBtn.addEventListener('click', pickRandomReward);

      dismissRewardBtn.addEventListener('click', () => {
        rewardSpotlight.classList.remove('visible');
      });

      filterPills.forEach(pill => {
        pill.addEventListener('click', () => {
          filterPills.forEach(p => {
            p.classList.remove('active');
            p.setAttribute('aria-selected', 'false');
          });
          pill.classList.add('active');
          pill.setAttribute('aria-selected', 'true');
          activeFilter = pill.getAttribute('data-category');
          render();
        });
      });

      resetDefaultsBtn.addEventListener('click', () => {
        if (confirm('Reset your dopamine menu to sample ideas?')) {
          menuData = buildInitialData();
          save();
          render();
          rewardSpotlight.classList.remove('visible');
        }
      });

      // Initial Render
      render();
    })();
  </script>
</body>
</html>
