<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit & Streak Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23FF8A5C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E9;--card-bg:#FFFFFF;--text:#2E2A26;--text-muted:#8a7a68;--accent:#FF8A5C;--accent-hover:#F27649;--accent-shadow:#D9633A;--gold:#FFC24B;--sage:#8FBFA0;--line:#F0E7D8;--soft:#FFF6E9;--radius:22px;--card-shadow:0 8px 0 var(--line),0 14px 28px rgba(46,42,38,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#241E1A;--card-bg:#2E2621;--text:#FBF1E6;--text-muted:#C2AF9E;--line:#453A31;--soft:#241E1A;--card-shadow:0 8px 0 var(--line),0 16px 30px rgba(0,0,0,.4)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',Arial,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{display:flex;align-items:flex-start;justify-content:center;padding:16px}
.wrap{width:100%;max-width:600px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.head h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem}
.meta{font-size:.85rem;font-weight:600;color:var(--text-muted)}
button{font-family:inherit;cursor:pointer}
.add{display:flex;gap:10px;margin-bottom:16px}
input[type=text]{font-family:inherit;font-weight:600;font-size:.95rem;color:var(--text);background:var(--card-bg);border:2px solid var(--line);border-radius:14px;min-height:46px;padding:0 16px;width:100%}
input::placeholder{color:var(--text-muted);opacity:.8}
.btn{min-height:46px;border-radius:16px;border:2px solid var(--line);background:var(--card-bg);color:var(--text);font-weight:700;font-size:.95rem;padding:0 20px;transition:all .15s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-shadow)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-shadow)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#list{display:flex;flex-direction:column;gap:14px;max-height:520px;overflow-y:auto;padding:2px}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--card-shadow);padding:20px 22px}
.row1{display:flex;align-items:center;gap:14px}
.emoji{font-size:30px;flex:none;width:44px;text-align:center}
.name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;flex:1;overflow-wrap:anywhere}
.streak{font-size:.85rem;font-weight:600;color:var(--accent);white-space:nowrap}
.del{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);font-size:1rem;flex:none}
.del:hover{color:var(--accent)}
.dotrow{display:flex;gap:8px;margin-top:14px}
.d{flex:1;height:28px;border-radius:9px;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--text-muted)}
.d.on{background:var(--accent);border-color:var(--accent);color:#fff}
.d.today{border-color:var(--accent)}
.bar{height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .3s ease}
.empty{text-align:center;color:var(--text-muted);padding:30px 0;font-size:.95rem;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#wdThemeBtn{position:fixed;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.75;z-index:50;padding:0}#wdThemeBtn:hover{opacity:1;border-color:var(--accent)}#wdThemeBtn svg{width:16px;height:16px}
[data-theme="dark"]{--bg:#241E1A;--card-bg:#2E2621;--text:#FBF1E6;--text-muted:#C2AF9E;--line:#453A31;--soft:#241E1A;--card-shadow:0 8px 0 var(--line),0 16px 30px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#FFF6E9;--card-bg:#FFFFFF;--text:#2E2A26;--text-muted:#8a7a68;--line:#F0E7D8;--soft:#FFF6E9;--card-shadow:0 8px 0 var(--line),0 14px 28px rgba(46,42,38,.06)}
@media (pointer:coarse),(max-width:440px){.d{height:34px}.del{width:38px;height:38px}}
</style></head>
<body>
<main class="wrap">
 <div class="head"><h1>Habit &amp; Streak Tracker</h1><span class="meta" id="today"></span></div>
 <form class="add" id="f"><input id="in" type="text" maxlength="60" placeholder="Add a habit (e.g. Drink water)" aria-label="Add a habit"><button class="btn btn-primary" type="submit">Add</button></form>
 <div id="list" role="list"></div>
</main>
<script>
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var EMOJI=['\u{1F525}','\u{1F4A7}','\u{1F31C}','\u{1F9D8}','\u{1F4D6}','\u{1F6B6}','\u{1F957}','\u{1F634}'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekDates(){
 var now=new Date();var day=(now.getDay()+6)%7;var mon=new Date(now);mon.setDate(now.getDate()-day);
 var out=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);out.push(d)}
 return out
}
var DOW=['M','T','W','T','F','S','S'];
var K='wd_habit_streak_v1';
var s=store.get(K,{habits:[
 {id:1,name:'Drink water',emoji:'\u{1F4A7}',done:{}},
 {id:2,name:'Sleep by 11pm',emoji:'\u{1F31C}',done:{}}
]});
function save(){store.set(K,s)}
function streakFor(h){
 var n=0;var d=new Date();
 while(true){var k=ymd(d);if(h.done[k]){n++;d.setDate(d.getDate()-1)}else break}
 return n
}
function render(){
 $('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
 var wk=weekDates();var todayKey=ymd(new Date());
 var l=$('#list');l.innerHTML='';
 if(!s.habits.length){l.innerHTML='<div class="empty">No habits yet. Add your first one above.</div>';return}
 s.habits.forEach(function(h){
  var done=wk.filter(function(d){return h.done[ymd(d)]}).length;
  var streak=streakFor(h);
  var card=document.createElement('div');card.className='card';card.setAttribute('role','listitem');
  var dots=wk.map(function(d,i){var k=ymd(d);var on=h.done[k];var isToday=k===todayKey;
   return '<button type="button" class="d'+(on?' on':'')+(isToday?' today':'')+'" data-k="'+k+'" aria-label="'+DOW[i]+(on?' done':' not done')+'">'+DOW[i]+'</button>'}).join('');
  card.innerHTML='<div class="row1"><span class="emoji">'+h.emoji+'</span><span class="name">'+esc(h.name)+'</span><span class="streak">'+(streak?streak+' day streak':'')+'</span><button type="button" class="del" aria-label="Delete habit">&times;</button></div>'+
   '<div class="dotrow">'+dots+'</div>'+
   '<div class="bar"><i style="width:'+Math.round(done/7*100)+'%"></i></div>';
  card.querySelectorAll('.d').forEach(function(btn){btn.onclick=function(){var k=btn.getAttribute('data-k');h.done[k]=!h.done[k];save();render()}});
  card.querySelector('.del').onclick=function(){s.habits=s.habits.filter(function(x){return x!==h});save();render()};
  l.appendChild(card)
 })
}
$('#f').onsubmit=function(e){e.preventDefault();var v=$('#in').value.trim();if(!v)return;
 var emoji=EMOJI[s.habits.length%EMOJI.length];
 s.habits.push({id:Date.now(),name:v,emoji:emoji,done:{}});$('#in').value='';save();render()};
render();
</script><button id="wdThemeBtn" type="button" aria-label="Switch between light and dark mode" title="Light / dark"></button><script>(function(){var K='wd_theme',b=document.getElementById('wdThemeBtn');if(!b)return;
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function get(){try{return localStorage.getItem(K)}catch(e){return null}}
function set(v){try{localStorage.setItem(K,v)}catch(e){}}
function sys(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function cur(){return document.documentElement.getAttribute('data-theme')||sys()}
function apply(t){document.documentElement.setAttribute('data-theme',t);b.innerHTML=t==='dark'?SUN:MOON}
var s0=get();if(s0==='dark'||s0==='light')apply(s0);else b.innerHTML=sys()==='dark'?SUN:MOON;
b.onclick=function(){var n=cur()==='dark'?'light':'dark';set(n);apply(n)};})();</script></body></html>
