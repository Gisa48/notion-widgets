<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit & Streak Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='none' stroke='%23C99A4B' stroke-width='8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F7F2EC;--card:#FFFDFB;--text:#2B2420;--muted:#9A8B7E;--line:#EDE3D8;--medal:#FBF4EC;
 --gold1:#B8893B;--gold2:#E9C77B;--rose1:#B76E79;--rose2:#EBB5B0;--roseText:#A45C67;--goldText:#9A7130;
 --btn:#2B2420;--btnText:#F3DFB2;--shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px rgba(92,64,38,.08);--radius:24px}
@media (prefers-color-scheme:dark){:root{--bg:#1C1714;--card:#26201B;--text:#F6EDE3;--muted:#B5A596;--line:#3A3029;--medal:#2E2620;--roseText:#EBB5B0;--goldText:#E9C77B;--btn:#E9C77B;--btnText:#2B2420;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px rgba(0,0,0,.45)}}
[data-theme="dark"]{--bg:#1C1714;--card:#26201B;--text:#F6EDE3;--muted:#B5A596;--line:#3A3029;--medal:#2E2620;--roseText:#EBB5B0;--goldText:#E9C77B;--btn:#E9C77B;--btnText:#2B2420;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px rgba(0,0,0,.45)}
[data-theme="light"]{--bg:#F7F2EC;--card:#FFFDFB;--text:#2B2420;--muted:#9A8B7E;--line:#EDE3D8;--medal:#FBF4EC;--roseText:#A45C67;--goldText:#9A7130;--btn:#2B2420;--btnText:#F3DFB2;--shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 30px rgba(92,64,38,.08)}
html[data-bg="blush"]{--bg:#FCE4E7;--line:#F3D3D8;--medal:#FFF5F6}
html[data-bg="peach"]{--bg:#FDE7D8;--line:#F4D6C2;--medal:#FFF6EF}
html[data-bg="butter"]{--bg:#FFF2CC;--line:#F1E0AE;--medal:#FFFAEA}
html[data-bg="mint"]{--bg:#E2F4E6;--line:#CDE6D3;--medal:#F4FBF5}
html[data-bg="sky"]{--bg:#DFF1F6;--line:#C9E2EA;--medal:#F3FAFC}
html[data-bg="lavender"]{--bg:#ECE5FA;--line:#DCD1F0;--medal:#F8F5FE}
html[data-bg][data-theme="dark"]{--bg:#1C1714;--line:#3A3029;--medal:#2E2620}
@media (prefers-color-scheme:dark){html[data-bg]:not([data-theme="light"]){--bg:#1C1714;--line:#3A3029;--medal:#2E2620}}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(184,137,59,.55);padding:0;transition:transform .15s;box-shadow:0 2px 6px rgba(92,64,38,.12)}
.sw:hover{transform:scale(1.15)}
.sw[aria-pressed="true"]{border-color:var(--gold1);box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--gold1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{display:flex;justify-content:center;padding:18px 16px 48px}
.wrap{width:100%;max-width:600px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:2.1rem;line-height:1;letter-spacing:-.01em}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--rose1),var(--gold1));-webkit-background-clip:text;background-clip:text;color:transparent}
.date{font-size:.82rem;font-weight:500;color:var(--muted);white-space:nowrap}
.summary{font-size:.85rem;color:var(--muted);margin-bottom:16px}
.summary b{color:var(--goldText);font-weight:600}
button{font-family:inherit;cursor:pointer}
.add{display:flex;gap:10px;margin-bottom:18px}
input[type=text]{font-family:inherit;font-weight:500;font-size:.95rem;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:999px;min-height:48px;padding:0 20px;width:100%;box-shadow:var(--shadow)}
input::placeholder{color:var(--muted)}
input:focus{outline:none;border-color:var(--gold2)}
.btn-add{min-height:48px;border-radius:999px;border:none;background:var(--btn);color:var(--btnText);font-weight:600;font-size:.95rem;padding:0 24px;letter-spacing:.02em;transition:transform .15s,opacity .15s}
.btn-add:hover{opacity:.9}.btn-add:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--gold1);outline-offset:3px}
#list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 20px}
.row1{display:flex;align-items:center;gap:14px}
.medal{flex:none;width:52px;height:52px;border-radius:50%;background:var(--medal);border:1px solid transparent;background-image:linear-gradient(var(--medal),var(--medal)),linear-gradient(135deg,var(--gold2),var(--rose2));background-origin:border-box;background-clip:padding-box,border-box;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .2s}
.medal:hover{transform:rotate(-6deg) scale(1.04)}
.medal svg{width:30px;height:30px;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.medal.gold svg{stroke:url(#gGold)}.medal.rose svg{stroke:url(#gRose)}
.name{font-weight:600;font-size:1.06rem;flex:1;overflow-wrap:anywhere}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;color:var(--roseText);background:var(--medal);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;white-space:nowrap}
.streak svg{width:16px;height:16px;fill:url(#gRose)}
.del{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:1.1rem;flex:none;transition:all .15s}
.del:hover{color:var(--roseText)}
.del.sure{width:auto;border-radius:99px;padding:0 12px;background:linear-gradient(100deg,var(--rose1),var(--rose2));color:#fff;font-size:.76rem;font-weight:600}
.dotrow{display:flex;gap:7px;margin-top:16px}
.d{flex:1;height:34px;border-radius:12px;background:transparent;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--muted);transition:all .2s}
.d:hover:not(:disabled){border-color:var(--gold2)}
.d.on{background:linear-gradient(140deg,var(--gold1),var(--gold2));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(184,137,59,.28)}
.d.today:not(.on){border:1.5px solid var(--rose1);color:var(--roseText)}
.d:disabled{opacity:.4;cursor:default}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold1),var(--gold2) 55%,var(--rose2));border-radius:99px;transition:width .35s ease}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:.74rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 0;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#wdThemeBtn{position:fixed;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--goldText);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.8;z-index:50;padding:0}#wdThemeBtn:hover{opacity:1}#wdThemeBtn svg{width:16px;height:16px}
@media (max-width:480px){.head{flex-wrap:wrap;align-items:center}.side{width:100%;flex-direction:column;align-items:flex-start;gap:6px}}
@media (max-width:360px){.swatches{gap:6px}.sw{width:24px;height:24px}}
@media (pointer:coarse),(max-width:440px){.d{height:38px}.del{width:38px;height:38px}h1{font-size:1.8rem}.medal{width:46px;height:46px}.streak span{display:none}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9C77B"/><stop offset=".55" stop-color="#C99A4B"/><stop offset="1" stop-color="#A87B32"/></linearGradient>
 <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EBB5B0"/><stop offset=".55" stop-color="#C98A8F"/><stop offset="1" stop-color="#A9606B"/></linearGradient>
</defs></svg>
<main class="wrap">
 <div class="head"><h1>Habit &amp; <em>Streak</em> Tracker</h1><div class="side"><div class="swatches" id="sw" role="group" aria-label="Background colour"></div><span class="date" id="today"></span></div></div>
 <p class="summary" id="sum"></p>
 <form class="add" id="f"><input id="in" type="text" maxlength="60" placeholder="Add a habit (e.g. Morning walk)" aria-label="Add a habit"><button class="btn-add" type="submit">Add</button></form>
 <div id="list" role="list"></div>
</main>
<script>
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* Hand-drawn line icons: [svg paths, tone] */
var ICONS={
 moon:['<path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/><path d="M16.5 3.2l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z"/>','rose'],
 walk:['<circle cx="13.2" cy="4.3" r="1.8"/><path d="M12.6 7.6 10.8 14l3.1 3 1 4.2"/><path d="M10.8 14 8.3 21"/><path d="M12.5 8.4 9.4 10.3l-1 3.1"/><path d="M12.6 8.4l1.9 3 3 1.1"/>','gold'],
 drop:['<path d="M12 3.2s6 6.4 6 10.9a6 6 0 0 1-12 0c0-4.5 6-10.9 6-10.9z"/><path d="M9.3 14.6a2.7 2.7 0 0 0 2.7 2.6"/>','gold'],
 lotus:['<path d="M12 19.5c-2.6-2.4-3.1-6.3 0-11 3.1 4.7 2.6 8.6 0 11z"/><path d="M12 19.5c-3.9.2-7.6-1.6-9-5.4 3.4-.4 6.6 1.4 9 5.4z"/><path d="M12 19.5c3.9.2 7.6-1.6 9-5.4-3.4-.4-6.6 1.4-9 5.4z"/>','rose'],
 book:['<path d="M4 5.6c2.6-1.1 5.4-1 8 .6 2.6-1.6 5.4-1.7 8-.6v12.8c-2.6-1-5.4-.9-8 .6-2.6-1.5-5.4-1.6-8-.6z"/><path d="M12 6.2v12.9"/>','gold'],
 leaf:['<path d="M5 19c0-8.6 5.8-13.6 15-15 0 9-5.3 15-15 15z"/><path d="M5 19l8.5-8.5"/>','gold'],
 dumbbell:['<path d="M6.5 7.5v9M17.5 7.5v9M4 10v4M20 10v4M6.5 12h11"/>','gold'],
 pen:['<path d="M4 20l4.2-1 11-11-3.2-3.2-11 11z"/><path d="M14.2 6.6l3.2 3.2"/>','rose'],
 pill:['<path d="M10.4 20.4a4.9 4.9 0 0 1-6.9-6.9l6-6a4.9 4.9 0 0 1 6.9 6.9z"/><path d="M8.5 8.5l7 7"/>','rose'],
 sun:['<circle cx="12" cy="12" r="3.8"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/>','gold'],
 heart:['<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>','rose'],
 phone:['<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M4 4l16 16"/>','rose'],
 sparkle:['<path d="M12 3.5l1.7 5 5 1.7-5 1.7-1.7 5-1.7-5-5-1.7 5-1.7z"/><path d="M18.5 15.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/>','gold']
};
var ORDER=['sparkle','moon','walk','drop','lotus','book','leaf','dumbbell','pen','pill','sun','heart','phone'];
var WORDS=[[/water|drink|hydrat/i,'drop'],[/sleep|bed|night|pm\b|rest/i,'moon'],[/walk|run|step|jog|outside|hike/i,'walk'],[/meditat|breath|yoga|mindful|pray|calm/i,'lotus'],[/read|book|study|learn/i,'book'],[/eat|veg|fruit|salad|cook|meal|food/i,'leaf'],[/gym|workout|exercis|lift|stretch|train|pilates/i,'dumbbell'],[/journal|write|gratitude|plan|diary/i,'pen'],[/vitamin|pill|med|supplement/i,'pill'],[/morning|sun|wake|light/i,'sun'],[/love|call|family|friend|self.?care|skin/i,'heart'],[/phone|screen|scroll|social/i,'phone']];
function guess(name){for(var i=0;i<WORDS.length;i++)if(WORDS[i][0].test(name))return WORDS[i][1];return 'sparkle'}
var FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.8 3.4 4.8 5.6 4.8 10.4a4.8 4.8 0 0 1-9.6 0c0-2.2 1.1-3.6 2.2-4.6.2 1.6.9 2.6 1.9 3.1-.3-3.2.2-6.2.7-8.9z"/></svg>';
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekDates(){var now=new Date();var day=(now.getDay()+6)%7;var mon=new Date(now);mon.setDate(now.getDate()-day);var out=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);out.push(d)}return out}
var DOW=['M','T','W','T','F','S','S'];
var K='wd_habit_streak_v1';
var s=store.get(K,{habits:[{id:1,name:'Morning walk',icon:'walk',done:{}},{id:2,name:'Sleep by 11pm',icon:'moon',done:{}},{id:3,name:'Drink 2L of water',icon:'drop',done:{}},{id:4,name:'10 min meditation',icon:'lotus',done:{}}]});
s.habits.forEach(function(h){if(!ICONS[h.icon])h.icon=guess(h.name)});
function save(){store.set(K,s)}
function streakFor(h){var n=0;var d=new Date();if(!h.done[ymd(d)])d.setDate(d.getDate()-1);while(h.done[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function render(){
 $('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
 var wk=weekDates();var todayKey=ymd(new Date());var l=$('#list');l.innerHTML='';
 var total=0,doneAll=0;
 if(!s.habits.length){$('#sum').textContent='';l.innerHTML='<div class="empty">No habits yet. Add your first one above.</div>';return}
 s.habits.forEach(function(h){
  var done=wk.filter(function(d){return h.done[ymd(d)]}).length;total+=7;doneAll+=done;
  var streak=streakFor(h);var ic=ICONS[h.icon];
  var card=document.createElement('div');card.className='card';card.setAttribute('role','listitem');
  var dots=wk.map(function(d,i){var k=ymd(d);var on=h.done[k];var isToday=k===todayKey;var later=k>todayKey;
   return '<button type="button" class="d'+(on?' on':'')+(isToday?' today':'')+'" data-k="'+k+'"'+(later?' disabled':'')+' aria-label="'+DOW[i]+(on?' done':' not done')+'">'+DOW[i]+'</button>'}).join('');
  card.innerHTML='<div class="row1"><button type="button" class="medal '+ic[1]+'" title="Tap to change the icon" aria-label="Change icon"><svg viewBox="0 0 24 24">'+ic[0]+'</svg></button><span class="name">'+esc(h.name)+'</span>'+(streak?'<span class="streak">'+FLAME+streak+'<span>&nbsp;day'+(streak>1?'s':'')+'</span></span>':'')+'<button type="button" class="del" aria-label="Delete habit">&times;</button></div>'+
   '<div class="dotrow">'+dots+'</div><div class="bar"><i style="width:'+Math.round(done/7*100)+'%"></i></div><div class="meta"><span>This week</span><span>'+done+' / 7</span></div>';
  card.querySelectorAll('.d').forEach(function(btn){btn.onclick=function(){var k=btn.getAttribute('data-k');if(h.done[k])delete h.done[k];else h.done[k]=true;save();render()}});
  card.querySelector('.medal').onclick=function(){h.icon=ORDER[(ORDER.indexOf(h.icon)+1)%ORDER.length];save();render()};
  var del=card.querySelector('.del');
  del.onclick=function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='Delete?';del.setAttribute('aria-label','Tap again to delete');setTimeout(function(){if(del.isConnected){del.classList.remove('sure');del.innerHTML='&times;';del.setAttribute('aria-label','Delete habit')}},3000);return}
   s.habits=s.habits.filter(function(x){return x!==h});save();render()};
  l.appendChild(card)
 });
 $('#sum').innerHTML='This week: <b>'+doneAll+'</b> of '+total+' check-ins';
}
$('#f').onsubmit=function(e){e.preventDefault();var v=$('#in').value.trim();if(!v)return;
 s.habits.push({id:Date.now(),name:v,icon:guess(v),done:{}});$('#in').value='';save();render()};
render();
(function(){var BGS=[['cream','#EFE3D3','Cream'],['blush','#F6C6CD','Blush'],['peach','#F9CBAE','Peach'],['butter','#FBE39A','Butter'],['mint','#BFE6C8','Mint'],['sky','#B9E0EC','Sky'],['lavender','#D6C8F3','Lavender']];
 var box=$('#sw');var cur=store.get('wd_habit_bg','butter');
 function apply(v){if(v==='cream')document.documentElement.removeAttribute('data-bg');else document.documentElement.setAttribute('data-bg',v);
  box.querySelectorAll('.sw').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false')})}
 BGS.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='sw';b.dataset.v=c[0];b.style.background=c[1];b.title=c[2];b.setAttribute('aria-label',c[2]+' background');
  b.onclick=function(){store.set('wd_habit_bg',c[0]);apply(c[0])};box.appendChild(b)});
 apply(cur)})();
</script><button id="wdThemeBtn" type="button" aria-label="Switch between light and dark mode" title="Light / dark"></button><script>(function(){var K='wd_theme',b=document.getElementById('wdThemeBtn');if(!b)return;
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function get(){try{return localStorage.getItem(K)}catch(e){return null}}
function set(v){try{localStorage.setItem(K,v)}catch(e){}}
function sys(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function cur(){return document.documentElement.getAttribute('data-theme')||sys()}
function apply(t){document.documentElement.setAttribute('data-theme',t);b.innerHTML=t==='dark'?SUN:MOON}
var s0=get();if(s0==='dark'||s0==='light')apply(s0);else b.innerHTML=sys()==='dark'?SUN:MOON;
b.onclick=function(){var n=cur()==='dark'?'light':'dark';set(n);apply(n)};})();</script></body></html>
