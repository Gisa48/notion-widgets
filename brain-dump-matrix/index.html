<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Dump & Priority Matrix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%238A7FC7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F0F8;--card-bg:#FFFFFF;--text:#302C4D;--text-muted:#8B84A8;--ink:#6C63A6;--ink-hover:#5A5290;--ink-shadow:#4A4478;--teal:#6FA69A;--lav:#D9CFF0;--line:#E1DBEF;--soft:#F2F0F8;--card-radius:18px;--card-shadow:0 8px 0 var(--lav),0 14px 28px rgba(48,44,77,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#211F33;--card-bg:#2C2944;--text:#EDEAF7;--text-muted:#ADA6C9;--line:#453F63;--lav:#1A1828;--soft:#211F33;--card-shadow:0 8px 0 var(--lav),0 16px 30px rgba(0,0,0,.4)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',Arial,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{display:flex;align-items:flex-start;justify-content:center;padding:16px}
.widget-card{width:100%;max-width:560px;background:var(--card-bg);border:2.5px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:20px 20px 22px;transition:background-color .25s,border-color .25s}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.status-dot{width:12px;height:12px;border-radius:50%;background:var(--ink);flex:none}
.card-title{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;line-height:1.2}
.meta{font-size:.8rem;font-weight:800;color:var(--text-muted);letter-spacing:.04em}
button{font-family:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:var(--soft);border-radius:99px;padding:4px}
.tab{flex:1;min-height:36px;border-radius:99px;border:none;background:transparent;color:var(--text-muted);font-weight:800;font-size:.85rem}
.tab.on{background:var(--card-bg);color:var(--text);box-shadow:0 2px 6px rgba(48,44,77,.12)}
.btn{min-height:44px;border-radius:26px;border:2.5px solid var(--line);background:transparent;color:var(--text);font-weight:800;font-size:.95rem;padding:0 18px;transition:background-color .2s,transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 0 var(--ink-shadow)}
.btn-primary:hover{background:var(--ink-hover);border-color:var(--ink-hover)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink-shadow)}
.chip{min-height:32px;padding:0 12px;border-radius:99px;border:2px solid var(--line);background:var(--soft);color:var(--text-muted);font-weight:800;font-size:.78rem;transition:all .2s}
.chip:hover{border-color:var(--ink);color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--card-bg)}
.chip.on.impact{background:var(--teal);border-color:var(--teal)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--text-muted);font-size:1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}
input[type=text]{font-family:inherit;font-weight:700;font-size:.95rem;color:var(--text);background:var(--soft);border:2px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;width:100%}
input::placeholder{color:var(--text-muted);opacity:.8}
.check{width:26px;height:26px;flex:none;border-radius:9px;border:2.5px solid var(--teal);background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.check.on{background:var(--teal)}
.check svg{width:15px;height:15px;opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.add{display:flex;gap:10px;margin-bottom:14px}
.add .btn{flex:none}
#list{max-height:340px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.item{padding:10px 0;border-bottom:1.5px solid var(--line)}
.item:last-child{border-bottom:0}
.item-row{display:flex;align-items:center;gap:10px}
.item span.t{flex:1;font-size:.95rem;overflow-wrap:anywhere}
.item.done span.t{text-decoration:line-through;color:var(--text-muted)}
.tagrow{display:flex;gap:6px;margin:8px 0 0 36px;flex-wrap:wrap}
.empty{text-align:center;color:var(--text-muted);padding:22px 0;font-size:.9rem;font-weight:700}
.spot{margin:0 0 14px;padding:16px;border-radius:16px;background:var(--soft);border:2.5px dashed var(--ink);animation:pop .3s ease}
.spot small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.spot p{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:1.1rem;line-height:1.3;margin-bottom:12px;overflow-wrap:anywhere}
.spot .row{display:flex;gap:8px}
.spot .btn{min-height:38px;font-size:.85rem;padding:0 14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quad{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:110px}
.quad h4{font-family:'Fraunces',Georgia,serif;font-size:.95rem;margin-bottom:8px}
.quad.qw{border-color:var(--teal)}
.quad.qw h4{color:var(--teal)}
.quad.bb{border-color:var(--ink)}
.quad.bb h4{color:var(--ink)}
.quad .qi{font-size:.85rem;padding:5px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.quad .qi:last-child{border-bottom:0}
.quad .qempty{color:var(--text-muted);font-size:.78rem;font-weight:700}
[data-theme="dark"]{--bg:#211F33;--card-bg:#2C2944;--text:#EDEAF7;--text-muted:#ADA6C9;--line:#453F63;--lav:#1A1828;--soft:#211F33;--card-shadow:0 8px 0 var(--lav),0 16px 30px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#F2F0F8;--card-bg:#FFFFFF;--text:#302C4D;--text-muted:#8B84A8;--line:#E1DBEF;--lav:#D9CFF0;--soft:#F2F0F8;--card-shadow:0 8px 0 var(--lav),0 14px 28px rgba(48,44,77,.08)}
#wdThemeBtn{position:fixed;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.75;transition:opacity .2s,border-color .2s;z-index:50;padding:0}#wdThemeBtn:hover{opacity:1;border-color:var(--ink,#6C63A6)}#wdThemeBtn:focus-visible{outline:3px solid var(--ink,#6C63A6);outline-offset:2px}#wdThemeBtn svg{width:16px;height:16px}
@media (pointer:coarse),(max-width:440px){#wdThemeBtn{width:40px;height:40px;right:10px;bottom:10px}#wdThemeBtn svg{width:18px;height:18px}.check{width:34px;height:34px;border-radius:11px}.check svg{width:18px;height:18px}.icon-btn{width:40px;height:40px}.chip{min-height:38px}}
</style></head>
<body>
<main class="widget-card">
 <div class="card-header"><div class="title-wrap"><span class="status-dot"></span><h1 class="card-title">Brain Dump &amp; Priority</h1></div><span class="meta" id="count"></span></div>
 <div class="tabs"><button class="tab on" id="tabList" type="button">List</button><button class="tab" id="tabMatrix" type="button">Matrix</button></div>
 <form class="add" id="f"><input id="in" type="text" maxlength="140" placeholder="What is on your mind?" aria-label="Add a thought"><button class="btn btn-primary" type="submit">Add</button></form>
 <div id="spot"></div>
 <div id="view"></div>
 <div class="foot"><button class="btn" id="pick" type="button">Pick one for me</button><button class="btn" id="clr" type="button">Clear done</button></div>
</main>
<script>
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

var K='wd_braindump_matrix_v1';var s=store.get(K,{items:[]});var spotId=null;var view='list';
function save(){store.set(K,s)}

function renderTags(it){
 var eff=['Low','High'],imp=['Low','High'];
 var h='<div class="tagrow">';
 h+='<span style="font-size:.7rem;font-weight:800;color:var(--text-muted);align-self:center">EFFORT</span>';
 eff.forEach(function(v){h+='<button type="button" class="chip'+(it.effort===v?' on':'')+'" data-k="effort" data-v="'+v+'">'+v+'</button>'});
 h+='<span style="font-size:.7rem;font-weight:800;color:var(--text-muted);align-self:center;margin-left:6px">IMPACT</span>';
 imp.forEach(function(v){h+='<button type="button" class="chip'+(it.impact===v?' on impact':'')+'" data-k="impact" data-v="'+v+'">'+v+'</button>'});
 h+='</div>';
 return h;
}

function renderList(){
 var l=document.createElement('div');l.id='list';l.setAttribute('role','list');
 if(!s.items.length){l.innerHTML='<div class="empty">Empty head, empty list. Type anything above.</div>';return l}
 s.items.forEach(function(it){
  var d=document.createElement('div');d.className='item'+(it.d?' done':'');d.setAttribute('role','listitem');
  d.innerHTML='<div class="item-row"><button type="button" class="check'+(it.d?' on':'')+'" aria-label="Mark done" aria-pressed="'+it.d+'">'+CHECK_SVG+'</button><span class="t">'+esc(it.t)+'</span><button type="button" class="icon-btn" aria-label="Delete">&times;</button></div>'+renderTags(it);
  d.querySelector('.check').onclick=function(){it.d=!it.d;save();render()};
  d.querySelector('.icon-btn').onclick=function(){s.items=s.items.filter(function(x){return x!==it});if(spotId===it.id)spotId=null;save();render()};
  d.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){var k=c.getAttribute('data-k'),v=c.getAttribute('data-v');it[k]=(it[k]===v?null:v);save();render()}});
  l.appendChild(d)});
 return l;
}

function quadItems(effort,impact){return s.items.filter(function(x){return!x.d&&x.effort===effort&&x.impact===impact})}
function quadHtml(title,effort,impact,cls){
 var items=quadItems(effort,impact);
 var h='<div class="quad '+cls+'"><h4>'+title+'</h4>';
 if(!items.length)h+='<div class="qempty">Nothing here yet</div>';
 else items.forEach(function(it){h+='<div class="qi">'+esc(it.t)+'</div>'});
 h+='</div>';return h
}
function renderMatrix(){
 var d=document.createElement('div');d.className='matrix';
 d.innerHTML=quadHtml('Quick win','Low','High','qw')+quadHtml('Big bet','High','High','bb')+quadHtml('Fill-in','Low','Low','')+quadHtml('Reconsider','High','Low','');
 return d
}

function render(){
 var v=$('#view');v.innerHTML='';
 v.appendChild(view==='list'?renderList():renderMatrix());
 var open=s.items.filter(function(x){return!x.d}).length;
 $('#count').textContent=s.items.length?(s.items.length+' caught · '+(s.items.length-open)+' done'):'';
 var sp=$('#spot');var it=s.items.filter(function(x){return x.id===spotId&&!x.d})[0];
 if(it){sp.innerHTML='<div class="spot"><small>Do this one now</small><p>'+esc(it.t)+'</p><div class="row"><button class="btn btn-primary" id="sd" type="button">Done</button><button class="btn" id="sa" type="button">Another</button></div></div>';
  $('#sd').onclick=function(){it.d=true;spotId=null;save();render()};$('#sa').onclick=pick}else sp.innerHTML='';
}
function pick(){
 var pool=s.items.filter(function(x){return!x.d&&x.effort==='Low'&&x.impact==='High'&&x.id!==spotId});
 if(!pool.length)pool=s.items.filter(function(x){return!x.d&&x.id!==spotId});
 if(!pool.length)pool=s.items.filter(function(x){return!x.d});
 if(!pool.length){spotId=null;render();return}
 spotId=pool[Math.floor(Math.random()*pool.length)].id;render()
}
$('#f').onsubmit=function(e){e.preventDefault();var v=$('#in').value.trim();if(!v)return;s.items.unshift({id:Date.now()+Math.random(),t:v,d:false,effort:null,impact:null});$('#in').value='';save();render()};
$('#pick').onclick=pick;
$('#clr').onclick=function(){s.items=s.items.filter(function(x){return!x.d});save();render()};
$('#tabList').onclick=function(){view='list';$('#tabList').classList.add('on');$('#tabMatrix').classList.remove('on');render()};
$('#tabMatrix').onclick=function(){view='matrix';$('#tabMatrix').classList.add('on');$('#tabList').classList.remove('on');render()};
render();
</script><button id="wdThemeBtn" type="button" aria-label="Switch between light and dark mode" title="Light / dark"></button><script>(function(){var K='wd_theme',b=document.getElementById('wdThemeBtn');if(!b)return;
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function get(){try{return localStorage.getItem(K)}catch(e){return null}}
function set(v){try{localStorage.setItem(K,v)}catch(e){}}
function sys(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function cur(){return document.documentElement.getAttribute('data-theme')||sys()}
function apply(t){document.documentElement.setAttribute('data-theme',t);b.innerHTML=t==='dark'?SUN:MOON}
var s=get();if(s==='dark'||s==='light')apply(s);else b.innerHTML=sys()==='dark'?SUN:MOON;
b.onclick=function(){var n=cur()==='dark'?'light':'dark';set(n);apply(n)};})();</script></body></html>
