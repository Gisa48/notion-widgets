<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Timer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23C4886C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Theme colours are the CSS variables at the top: change them to restyle the widget. */
:root{--bg:#F8F3EA;--card-bg:#FFFFFF;--text:#4A3A30;--text-muted:#8C7A6B;--clay:#C4886C;--clay-hover:#B3765A;--clay-shadow:#A86F55;--sage:#9DAA92;--sand:#D8B98F;--line:#DDD0C3;--soft:#F8F3EA;--card-radius:18px;--card-shadow:0 8px 0 var(--sand),0 14px 28px rgba(74,58,48,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#2F2620;--card-bg:#3A2D25;--text:#F8F3EA;--text-muted:#B8A99C;--line:#524237;--sand:#231B16;--soft:#2F2620;--card-shadow:0 8px 0 var(--sand),0 16px 30px rgba(0,0,0,.4)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',Arial,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{display:flex;align-items:flex-start;justify-content:center;padding:16px}
.widget-card{width:100%;max-width:520px;background:var(--card-bg);border:2.5px solid var(--line);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:20px 20px 22px;transition:background-color .25s,border-color .25s}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.status-dot{width:12px;height:12px;border-radius:50%;background:var(--clay);flex:none}
.card-title{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1.2}
.meta{font-size:.8rem;font-weight:800;color:var(--text-muted);letter-spacing:.04em}
button{font-family:inherit;cursor:pointer}
.btn{min-height:44px;border-radius:26px;border:2.5px solid var(--line);background:transparent;color:var(--text);font-weight:800;font-size:.95rem;padding:0 18px;transition:background-color .2s,transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--clay)}
.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,input:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
.btn-primary{background:var(--clay);border-color:var(--clay);color:#fff;box-shadow:0 4px 0 var(--clay-shadow)}
.btn-primary:hover{background:var(--clay-hover);border-color:var(--clay-hover)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--clay-shadow)}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--soft);color:var(--text-muted);font-weight:800;font-size:.85rem;transition:all .2s}
.chip:hover{border-color:var(--clay);color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--card-bg)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--text-muted);font-size:1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{border-color:var(--clay);color:var(--clay)}
input[type=text],input[type=number]{font-family:inherit;font-weight:700;font-size:.95rem;color:var(--text);background:var(--soft);border:2px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;width:100%}
input::placeholder{color:var(--text-muted);opacity:.8}
.bar{height:10px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .35s ease}
.check{width:28px;height:28px;flex:none;border-radius:9px;border:2.5px solid var(--sage);background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.check.on{background:var(--sage)}
.check svg{width:16px;height:16px;opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.disc-wrap{display:flex;justify-content:center;margin:2px 0 6px}
#disc{width:100%;max-width:196px;height:auto}
.digits{text-align:center;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:2.1rem;letter-spacing:-.02em;line-height:1;margin:4px 0 2px}
.state{text-align:center;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;align-items:center}
.chips .chip{min-height:34px;padding:0 12px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.custom{display:flex;gap:6px;align-items:center;color:var(--text-muted);font-size:.8rem;font-weight:800}
.custom input{width:64px;min-height:34px;text-align:center;padding:0 6px}
.sound{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:.8rem;color:var(--text-muted);font-weight:800}
.done #wedge{fill:var(--sage)}
[data-theme="dark"]{--bg:#2F2620;--card-bg:#3A2D25;--text:#F8F3EA;--text-muted:#B8A99C;--line:#524237;--sand:#231B16;--soft:#2F2620;--card-shadow:0 8px 0 var(--sand),0 16px 30px rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#F8F3EA;--card-bg:#FFFFFF;--text:#4A3A30;--text-muted:#8C7A6B;--line:#DDD0C3;--sand:#D8B98F;--soft:#F8F3EA;--card-shadow:0 8px 0 var(--sand),0 14px 28px rgba(74,58,48,.07)}
#wdThemeBtn{position:fixed;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.75;transition:opacity .2s,border-color .2s;z-index:50;padding:0}#wdThemeBtn:hover{opacity:1;border-color:var(--clay,#C4886C)}#wdThemeBtn:focus-visible{outline:3px solid var(--clay,#C4886C);outline-offset:2px}#wdThemeBtn svg{width:16px;height:16px}
</style></head>
<body>
<main class="widget-card" id="card">
 <div class="card-header"><div class="title-wrap"><span class="status-dot"></span><h1 class="card-title">Time Timer</h1></div><span class="meta" id="meta">60 min dial</span></div>
 <div class="disc-wrap"><svg id="disc" viewBox="0 0 220 220" role="img" aria-label="Visual countdown disc"></svg></div>
 <div class="digits" id="digits" aria-live="off">25:00</div>
 <div class="state" id="state">Ready when you are</div>
 <div class="chips" id="chips" role="group" aria-label="Choose minutes"></div>
 <div class="custom"><label for="cm">Custom</label><input id="cm" type="number" min="1" max="60" value="25" inputmode="numeric"><span>min</span></div>
 <div class="row"><button class="btn btn-primary" id="go" type="button">Start</button><button class="btn" id="reset" type="button">Reset</button></div>
 <label class="sound"><input type="checkbox" id="snd"> Soft chime when time is up</label>
</main>
<script>

var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';


var PRESETS=[5,10,15,25,30,45,60];
var st=store.get('wd_timetimer_v1',{min:25,sound:false});
var total=st.min*60, remain=total, running=false, endAt=0, timer=null, actx=null;
var disc=$('#disc'),digits=$('#digits'),stateEl=$('#state'),go=$('#go'),cm=$('#cm'),snd=$('#snd'),card=$('#card');
function build(){
 var s='<circle cx="110" cy="110" r="96" fill="var(--soft)" stroke="var(--line)" stroke-width="3"/>';
 s+='<path id="wedge" d="" fill="var(--clay)"/>';
 for(var m=0;m<60;m++){var a=(m*6)*Math.PI/180,r1=m%5===0?86:90,r2=96;
  s+='<line x1="'+(110+r1*Math.sin(a)).toFixed(1)+'" y1="'+(110-r1*Math.cos(a)).toFixed(1)+'" x2="'+(110+r2*Math.sin(a)).toFixed(1)+'" y2="'+(110-r2*Math.cos(a)).toFixed(1)+'" stroke="var(--text-muted)" stroke-width="'+(m%5===0?2:1)+'" opacity=".7"/>';}
 for(var k=0;k<12;k++){var an=(k*30)*Math.PI/180;
  s+='<text x="'+(110+72*Math.sin(an)).toFixed(1)+'" y="'+(110-72*Math.cos(an)+5).toFixed(1)+'" text-anchor="middle" font-family="Nunito,Arial" font-weight="800" font-size="13" fill="var(--text)">'+(k===0?'60':k*5)+'</text>';}
 s+='<circle cx="110" cy="110" r="6" fill="var(--card-bg)" stroke="var(--line)" stroke-width="2.5"/>';
 disc.innerHTML=s;
 var c=$('#chips');c.innerHTML='';
 PRESETS.forEach(function(p){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=p+' min';b.dataset.m=p;b.onclick=function(){setMin(p)};c.appendChild(b)});
 c.appendChild($('.custom'));
}
function wedge(frac){var w=$('#wedge');if(!w)return;frac=Math.max(0,Math.min(1,frac));
 if(frac<=0){w.setAttribute('d','');return}
 if(frac>=.9999){w.setAttribute('d','M110 110 m-96 0 a96 96 0 1 0 192 0 a96 96 0 1 0 -192 0');return}
 var a=frac*2*Math.PI,x=110+96*Math.sin(a),y=110-96*Math.cos(a);
 w.setAttribute('d','M110 110 L110 14 A96 96 0 '+(a>Math.PI?1:0)+' 1 '+x.toFixed(2)+' '+y.toFixed(2)+' Z');}
function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function paint(){wedge(remain/3600);digits.textContent=fmt(remain);document.title=running?fmt(remain)+' \u00b7 Time Timer':'Time Timer';
 Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){c.classList.toggle('on',+c.dataset.m===st.min)});cm.value=st.min}
function setMin(m){m=Math.max(1,Math.min(60,Math.round(+m)||25));stop();st.min=m;store.set('wd_timetimer_v1',st);total=m*60;remain=total;card.classList.remove('done');stateEl.textContent='Ready when you are';go.textContent='Start';paint()}
function stop(){running=false;clearInterval(timer);timer=null}
function tick(){remain=(endAt-Date.now())/1000;if(remain<=0){remain=0;stop();card.classList.add('done');stateEl.textContent="Time's up";go.textContent='Start again';chime();paint();return}paint()}
function chime(){if(!st.sound)return;try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;actx=actx||new A();var t=actx.currentTime;[528,660].forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,t+i*.25);g.gain.linearRampToValueAtTime(.12,t+i*.25+.05);g.gain.exponentialRampToValueAtTime(.0001,t+i*.25+1.1);o.connect(g);g.connect(actx.destination);o.start(t+i*.25);o.stop(t+i*.25+1.2)})}catch(e){}}
go.onclick=function(){
 if(running){stop();stateEl.textContent='Paused';go.textContent='Resume';paint();return}
 if(remain<=0){remain=total;card.classList.remove('done')}
 try{var A=window.AudioContext||window.webkitAudioContext;if(A&&st.sound&&!actx)actx=new A();if(actx&&actx.state==='suspended')actx.resume()}catch(e){}
 running=true;endAt=Date.now()+remain*1000;stateEl.textContent='Stay with it';go.textContent='Pause';timer=setInterval(tick,250);tick()};
$('#reset').onclick=function(){setMin(st.min)};
cm.onchange=function(){setMin(cm.value)};
snd.checked=!!st.sound;snd.onchange=function(){st.sound=snd.checked;store.set('wd_timetimer_v1',st);if(st.sound)chime()};
document.addEventListener('visibilitychange',function(){if(running)tick()});
build();paint();

</script><button id="wdThemeBtn" type="button" aria-label="Switch between light and dark mode" title="Light / dark"></button><script>(function(){var K='wd_theme',b=document.getElementById('wdThemeBtn');if(!b)return;
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function get(){try{return localStorage.getItem(K)}catch(e){return null}}
function set(v){try{localStorage.setItem(K,v)}catch(e){}}
function sys(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function cur(){return document.documentElement.getAttribute('data-theme')||sys()}
function apply(t){document.documentElement.setAttribute('data-theme',t);b.innerHTML=t==='dark'?SUN:MOON}
var s=get();if(s==='dark'||s==='light')apply(s);else b.innerHTML=sys()==='dark'?SUN:MOON;
b.onclick=function(){var n=cur()==='dark'?'light':'dark';set(n);apply(n)};})();</script></body></html>
